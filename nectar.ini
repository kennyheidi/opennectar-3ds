# Open Nectar 3DS settings. Put this file at sdmc:/3ds/nectar/nectar.ini
# Every line is optional: if a line (or the whole file) is missing, the value shown here is used.
# Format: "name = value". Anything after # is a comment.
#
# TIP: most of these can be changed while playing. Tap the bottom screen to open Settings,
#      tap an option to change it, then tap "Save settings" to write them back to this file.

# --- Speed ------------------------------------------------------------------------------------------
fps_cap       = 30     # FPS limit: 30, 20, 15 or 60. 0 = no limit
max_dt_ms     = 66     # When FPS drops: 66 = game keeps full speed down to 15 FPS, 100 = down to 10 FPS, 0 = game slows down instead
auto_lod      = 3      # Auto detail: lowers detail by itself when the game gets slow, gives it back when things calm down. 0 = off, 2 = light, 3 = normal, 5 = strong
lod_model_px  = 40     # Draw distance: objects smaller than this on screen are hidden (in tenths of a pixel: 40 = 4 px). 0 = draw everything
lod_far_px    = 100    # Same, for objects near the edges of the screen (they can be hidden sooner). 100 = 10 px
lod_px        = 20     # Same, for small parts of a model (20 = 2 px). 0 = off
lod_simplify_px = 32   # Simpler far models: models smaller than this many pixels use a lower-detail version. 0 = off, 20 = light, 32 = normal, 48 = strong
piki_lod_exempt = 1    # Pikmin detail: 1 = Pikmin always at full detail, 0 = they follow the settings above
tri_min_area  = 0      # Skip tiny shapes: skip triangles smaller than this (hundredths of a square pixel). 0 = off, 25 = smallest, 50 = small, 100 = medium, 400 = large
fast_xform    = 0      # Vertex mode: 0 = classic, 1 = batched. Try both and keep whichever runs better for you
gpu_split     = 6000   # GPU head start: lets the graphics chip start drawing earlier. 0 = off, 3000 = small, 6000 = medium, 12000 = large
gfx_queue_kb  = 2048   # Size of the drawing queue in KB (128 to 4096). Leave at 2048 (1024 made busy areas wait on a full queue)

# --- Screens and picture ----------------------------------------------------------------------------
fps_counter   = 1      # Show FPS: 1 = small FPS number in the top-right corner, 0 = hidden
stretch       = 0      # 1 = stretch the picture to fill the whole top screen (no black bars at the sides; looks wider), 0 = original 4:3 shape
bottom_map    = 2      # Bottom screen while playing: 2 = map, 1 = map only after you find the Whimsical Radar (the Pikmin count shows anyway), 0 = text log
bottom_counter = 1     # 1 = small minimap + Pikmin count on the bottom screen, 0 = big map only (the count stays on the top screen)
map_zoom      = 2      # Map zoom: 2 = far, 4 = medium, 8 = close
lighting      = 1      # Lighting: 1 = like the GameCube (the game's own lights and ambient), 0 = simple (older builds, a bit faster)
cull_faces    = 1      # Draw only the side of each shape the game asks for: 1 = on (correct), 0 = both sides (old builds; makes Wollywogs black)
tex_max_dim   = 256    # Largest texture size in pixels. Smaller = less memory, blurrier. 0 = no limit
tex_budget_kb = -1     # Texture memory in KB. -1 = automatic (recommended)

# --- Sound ------------------------------------------------------------------------------------------
audio_rate    = 11025  # Sound quality: 11025 (fastest), 16000, 22050, 32000 (best, slowest)
audio_stx     = 1      # Music and cutscene audio: 1 = on, 0 = off (can save a short stutter when they load)
piki_voice_map = 1     # Pikmin voice fix: 1 = correct Pikmin sounds, 0 = old (wrong) sounds

# --- Game and files ---------------------------------------------------------------------------------
skip_title    = 1      # 1 = skip the title screen and go straight to the file select
unlock_all_areas = 0   # CHEAT: 1 = every area can be picked on the area-select map (works on new and old files; saved into the file when the game saves)
pak           = 1      # 1 = use nectar.pak if it is there (much faster loading)

# --- For bug reports (leave as is unless asked) -----------------------------------------------------
gfx_lite      = 1      # 1 = write performance info to log.txt once a second
audio_stats   = 0      # 1 or 2 = write sound engine info to log.txt
